openapi: '3.0.3'
info:
  title: Katalog API
  description: Dies ist eine API mit der wir Artikel administrieren.
  version: '1.0.0'
  x-api-id: 3f8b2c1e-7a4d-4e9b-9c2a-5d6e7f8a9b0c
  x-audience: company-internal
  contact:
    name: "KatalogAPI"
    url: "https://www.predic8.de"
    email: "info@predic8.de"
servers:
  - url: http://localhost:50001
tags:
    - name: Shop
    - name: General
paths:
  /articles:
    get:
      tags:
        - Shop
      operationId: getArticles
      summary: Gebe alle Artikel zurück
      description: Dieser Endpunkt liefert alle Artikel zurück
      responses:
        '200':
          description: OK
          content:
            application/json:
                schema:
                    $ref: '#/components/schemas/ArticleList'
        default:
          $ref: '#/components/responses/Problem'
    post:
        operationId: createArticle
        requestBody:
            $ref: '#/components/requestBodies/ArticleRequest'
        tags:
          - Shop
        summary: Erstelle einen Artikel
        description: | 
            Hier wird ein **Artikel** erstellt.
            Ein Artikel besteht aus:

                - name
                - preis
            
            Id wird nach Vergabe ebenfalls geliefert.

            ![alt text](https://substackcdn.com/image/fetch/$s_!3XMN!,f_auto,q_auto:good,fl_progressive:steep/https://substack-post-media.s3.amazonaws.com/public/images/de4970c5-e2d0-404f-b01d-127f68b9dfcf_2816x1536.jpeg "Logo Title Text 1")

        responses:
          '201':
            description: Created
            headers:
              Location:
                description: URI des neuen Artikels
                schema:
                    type: string
                    maxLength: 400
                    format: uri
            content:
              application/json:
                schema:
                    $ref: '#/components/schemas/Article'
          default:
            $ref: '#/components/responses/Problem'
  /articles/{aid}:
    parameters:
      - in: path
        name: aid
        schema:
            type: string
            maxLength: 36
        required: true
    get:
      tags:
        - Shop
      operationId: getArticle
      summary: Gebe einen Artikel zurück
      description: Dieser Endpunkt liefert einen spezifischen Artikel zurück
      responses:
        '200':
          description: OK
          content:
            application/json:
                schema:
                    $ref: '#/components/schemas/Article'
        default:
          $ref: '#/components/responses/Problem'
    put:
        operationId: updateArticle
        requestBody:
            $ref: '#/components/requestBodies/ArticleRequest'
        tags:
            - Shop
        summary: Ändere einen Artikel
        description: Dieser Endpunkt ändert einen Artikel
        responses:
            '200':
                description: Changed
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/Article'
            default:
                $ref: '#/components/responses/Problem'
    patch:
        operationId: patchArticle
        requestBody:
            content:
              application/json:
                schema:
                    $ref: '#/components/schemas/PatchArticle'
        tags:
            - Shop
        summary: Ändere das Feld eines Artikels
        description: Dieser Endpunkt ändert ein oder mehrere Felder eines Artikels
        responses:
            '200':
                description: Changed
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/Article'
            default:
                $ref: '#/components/responses/Problem'
    delete:
      tags:
        - Shop
      operationId: deleteArticle
      summary: Lösche einen Artikel
      description: Dieser Endpunkt löscht einen Artikel
      responses:
        '200':
          description: deleted
        default:
          $ref: '#/components/responses/Problem'

components:
  responses:
    Problem:
      description: Fehler (RFC 9457 Problem Details)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  requestBodies:
    ArticleRequest:
        required: true
        content:
          application/json:
            schema: 
                $ref: '#/components/schemas/SimpleArticle'
  schemas:
    Problem:
        type: object
        properties:
          type:
            type: string
            format: uri
            maxLength: 400
            example: https://example.com/problems/not-found
          title:
            type: string
            maxLength: 200
            example: Not Found
          status:
            type: integer
            format: int32
            minimum: 100
            maximum: 599
            example: 404
          detail:
            type: string
            maxLength: 1000
            example: Artikel mit der Id 42 existiert nicht.
          instance:
            type: string
            format: uri-reference
            maxLength: 400
    ArticleList:
        type: object
        properties:
          articles:
            type: array
            maxItems: 1000
            items:
              $ref: '#/components/schemas/Article'
        required:
          - articles
    PatchArticle:
        type: object
        minProperties: 1
        properties:
          name:
            type: string
            maxLength: 50
            example: Stellschrauben
            description: Artikelname
          
          preis:
            type: number
            format: float
            minimum: 0
            example: 0.99
            description: Preis des Artikels
    SimpleArticle:
        type: object
        properties:
          name:
            type: string
            maxLength: 50
            example: Stellschrauben
            description: Artikelname
          
          preis:
            type: number
            format: float
            minimum: 0
            example: 0.99
            description: Preis des Artikels                         
        required:
          - name
          - preis
    Article:
        type: object
        properties:
          id:
            type: string
            format: uuid
            maxLength: 36

          name:
            type: string
            maxLength: 50
            example: Stellschrauben
            description: Artikelname
          
          preis:
            type: number
            format: float
            minimum: 0
            example: 0.99
            description: Preis des Artikels
        required:
          - id
          - name
          - preis