openapi: '3.0.3'
info:
  title: Katalog API
  description: Dies ist eine API mit der wir Artikel administrieren.
  version: '1.0'
servers:
  - url: http://localhost:50001/
tags:
    - name: Shop
    - name: General
paths:
  /articles:
    get:
      tags:
        - Shop
      summary: Gebe alle Artikel zurück
      description: Dieser Endpunkt liefert alle Artikel zurück
      responses:
        '200':
          description: OK
          content:
            application/json:
                schema:
                    type: array
                    items:
                        $ref: '#/components/schemas/Article'    
    post:
        requestBody:
            content:
              application/json:
                schema:
                    $ref: '#/components/schemas/SimpleArticle'
        tags:
          - Shop
        summary: Erstelle einen Artikel
        description: | 
            Hier wird ein **Artikel** erstellt.
            Ein Artikel besteht aus:

                - name
                - preis
            
            Id wird nach Vergabe ebenfalls geliefert.

            ![alt text](https://substackcdn.com/image/fetch/$s_!3XMN!,f_auto,q_auto:good,fl_progressive:steep/https://substack-post-media.s3.amazonaws.com/public/images/de4970c5-e2d0-404f-b01d-127f68b9dfcf_2816x1536.jpeg "Logo Title Text 1")

        responses:
          '201':
            description: Created
            headers:
              Location:
                description: URI des neuen Artikels
                schema:
                    type: string
                    maxLength: 400
                    format: uri
            content:
              application/json:
                schema:
                    $ref: '#/components/schemas/Article'
  /articles/{aid}:
    parameters:
      - in: path
        name: aid
        schema:
            type: string
            maxLength: 36
        required: true
    get:
      tags:
        - Shop
      summary: Gebe einen Artikel zurück
      description: Dieser Endpunkt liefert einen spezifischen Artikel zurück
      responses:
        '200':
          description: OK
          content:
            application/json:
                schema:
                    $ref: '#/components/schemas/Article'
    put:
        requestBody:
            content:
              application/json:
                schema:
                    $ref: '#/components/schemas/SimpleArticle'
        tags:
            - Shop
        summary: Ändere einen Artikel
        description: Dieser Endpunkt ändert einen Artikel
        responses:
            '200':
                description: Changed
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/Article'
    patch:
        requestBody:
            content:
              application/json:
                schema:
                    $ref: '#/components/schemas/PatchArticle'
        tags:
            - Shop
        summary: Ändere das Feld eines Artikels
        description: Dieser Endpunkt ändert ein oder mehrere Felder eines Artikels
        responses:
            '200':
                description: Changed
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/Article'
    delete:
      tags:
        - Shop
      summary: Lösche einen Artikel zurück
      description: Dieser Endpunkt löscht einen Artikel
      responses:
        '200':
          description: deleted          

components:
  requestBodies:  
    ArticleRequest:
        content:
          application/json:
            schema: 
                $ref: '#/components/schemas/SimpleArticle'
  schemas:
    PatchArticle:
        type: object
        minProperties: 1
        properties:
          name:
            type: string
            maxLength: 50
            example: Stellschrauben
            description: Artikelname
          
          preis:
            type: number
            format: float
            minimum: 0
            example: 0.99
            description: Preis des Artikels
    SimpleArticle:
        type: object
        properties:
          name:
            type: string
            maxLength: 50
            example: Stellschrauben
            description: Artikelname
          
          preis:
            type: number
            format: float
            minimum: 0
            example: 0.99
            description: Preis des Artikels                         
        required:
          - name
          - preis
    Article:
        type: object
        properties:
          id:
            type: string
            format: uuid
            maxLength: 36

          name:
            type: string
            maxLength: 50
            example: Stellschrauben
            description: Artikelname
          
          preis:
            type: number
            format: float
            minimum: 0
            example: 0.99
            description: Preis des Artikels
        required:
          - id
          - name
          - preis